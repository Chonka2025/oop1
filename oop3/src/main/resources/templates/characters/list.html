<!DOCTYPE html>
<!-- Список всех персонажей + crud -->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Персонажи</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <div>
            <h1>Персонажи RPG</h1>
            <p>CRUD-интерфейс для работы с персонажами.</p>
        </div>
        <div class="actions">
            <a class="button" th:href="@{/characters/new}">Создать персонажа</a>
            <a class="button secondary" th:href="@{/guilds}">Гильдии</a>
        </div>
    </div>

    <form th:action="@{/characters}" method="get" class="search-form">
        <input type="text" name="search" th:value="${search}" placeholder="Поиск по имени...">
        <input type="hidden" name="sort" th:value="${sort}">
        <button type="submit">Найти</button>
        <a class="button secondary" th:href="@{/characters}">Сброс</a>
    </form>

    <div th:if="${#lists.isEmpty(characters)}" class="empty-state">
        Персонажей пока нет.
    </div>

    <table th:if="${!#lists.isEmpty(characters)}">
        <thead>
        <tr>
            <th>
                <a th:href="@{/characters(search=${search}, sort=${sort == 'asc' ? 'desc' : 'asc'})}" class="sort-link">
                    ID <span th:text="${sort == 'asc' ? 'Up' : 'Down'}"></span>
                </a>
            </th>
            <th>Имя</th>
            <th>Класс</th>
            <th>Уровень</th>
            <th>Гильдии</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="character : ${characters}">
            <td th:text="${character.id}"></td>
            <td th:text="${character.name}"></td>
            <td th:text="${character.characterClass}"></td>
            <td th:text="${character.level}"></td>
            <td>
                <a th:if="${character.guild != null}" th:href="@{|/guilds/${character.guild.id}|}"
                   th:text="${character.guild.name}" class="guild-badge"></a>
                <span th:if="${character.guild == null}" class="muted">—</span>
            </td>
            <td class="row-actions">
                <a th:href="@{|/characters/${character.id}|}">Открыть</a>
                <a th:href="@{|/characters/${character.id}/edit|}">Изменить</a>
                <form th:action="@{|/characters/${character.id}/delete|}" method="post">
                    <button class="link-button danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
